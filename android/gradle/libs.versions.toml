[versions]
# 版本矩阵说明：
# 这里不是随手挑的最新版，而是对齐到「库作者自己 CI 里跑通的组合」+「Google 官方样本」。
#  - Haze 1.7.3 自身构建用：Kotlin 2.3.20 / Jetpack Compose 1.12.0 / activity 1.12.2 / core 1.17.0
#    （Haze 是用这些版本编译出来的，消费方对齐最稳）
#  - KSP 2.3.12 的内部构建基线就是 Kotlin 2.3.20，且它要求 AGP >= 8.12.0
#  - Now in Android（Google 官方样本）验证过：Room 2.8.3 / Hilt 2.59 / lifecycle 2.10.0 / coroutines 1.10.1
#  - Gradle 8.14.6 是 8.x 线最新，满足 AGP 8.13 的要求，且仍只需 JDK 17
agp = "8.13.0"
kotlin = "2.3.20"
ksp = "2.3.12"

haze = "1.7.3"
room = "2.8.3"
hilt = "2.59"
hiltNavigationCompose = "1.2.0"
datastore = "1.1.1"

# 自由窗口需要 shell(2000)/root(0) 身份去执行 am / settings 命令。
# Shizuku 的 newProcess 从 13.1.1 起被标记废弃、14 起移除，官方要求改用 UserService，
# 所以这里只依赖 api + provider（provider 是 Shizuku 分发 Binder 用的 ContentProvider）。
shizuku = "13.1.5"

compose = "1.12.0"
material3 = "1.5.0"
materialIcons = "1.7.3"
activityCompose = "1.12.2"
lifecycle = "2.10.0"
coreKtx = "1.17.0"
coroutines = "1.10.1"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Compose 各构件显式锁定到 1.12.0（与 Haze 1.7.3 编译时一致），不使用 BOM：
# BOM 会把版本拉到它自己的组合上，和 Haze 的编译基线错开反而容易出运行时问题。
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "compose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "compose" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "compose" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }

# 玻璃质感：haze 是核心（hazeSource / hazeEffect），haze-materials 提供 Apple 官方材质预设
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-materials = { group = "dev.chrisbanes.haze", name = "haze-materials", version.ref = "haze" }

# Shizuku：api 提供 Shizuku / ShizukuProvider，provider 提供把 Binder 交给本进程的 ContentProvider
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
